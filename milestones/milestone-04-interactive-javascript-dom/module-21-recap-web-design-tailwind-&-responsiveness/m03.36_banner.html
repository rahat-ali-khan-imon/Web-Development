<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            font-family: "Manrope", sans-serif;
        }
    </style>
</head>
<body>
    <!-- Banner Section  -->
    <section class="grid grid-cols-2 container border border-red-500 mx-auto">
        <div class="banner-left space-y-[30px] bg-green-500"> 
            <h2 class="text-[80px] font-bold">It's good <br> tea time at The <br> Tea House</h2>
            <p class="text-[#777777]">Tea and Botanical Solutions Supplier Give Optimum <br> Satisfaction To Your Taste Buds.</p>
            <button class="py-4 px-6 bg-linear-to-r from-[#FF8938] to-[#FF0000] text-white font-semibold rounded-md">Explore More <span class="-rotate-45 inline-block"><i class="fa-solid fa-arrow-right"></i></span></button>
        </div>
        <div class="banner-right bg-purple-500 flex justify-end items-end">
            <img src="./images/banner.png" alt="">
            <!-- Rating div -->
            <div class="bg-white rounded-xl shadow-2xl flex justify-between items-center w-[255px]"> <!-- width -->
                <img src="./images/banner-rating.png" alt="">
                <div>
                    <h2 class="font-bold text-3xl">5.00</h2>
                    <p>Trust Pilot Ratings</p>
                </div>
            </div>
        </div>
    
    </section>
</body>
</html>
