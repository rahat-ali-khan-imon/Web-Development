<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even Handler</title>
</head>
<body>
    <h1 id="page-title">Even Handler</h1>
    <button id="btn-update-title">Update Title</button>

    <p id="user-info">No User</p>                                  <!-- -->
    <button id="btn-login">Login</button>

    <script>
        document.getElementById('btn-login')
            .addEventListener('click', function () {
                const userInfoElement = document.getElementById('user-info');               /*  */
                userInfoElement.innerText = 'User Logged in Successfully';
            }
        );
    </script>
    
    <script src="./m04.05_even_handler.js"></script>
</body>
</html>
