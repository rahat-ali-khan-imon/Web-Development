<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Events</title>
</head>
<body>
    <h1>DOM Doma Dom Events</h1>
    <!-- Option 1 for click event handler -->
    <button onclick="console.log(7);">Click Me</button>
    <button onclick="console.log(63);">Another Button</button>
    <button onclick="console.log('I am Clikded');">Third Button</button>
    <br><br>

    <!-- Option 2 for click event handler -->
    <button onclick="makeYellow()">Make Yellow</button>
    <button onclick="makeRed()">Make Red</button>                               <!-- -->
    <script>
        function makeYellow() {
            document.body.style.backgroundColor = 'yellow';
        }
        function makeRed() {                                                   /* */
            document.body.style.backgroundColor = 'red';
        }
    </script>

    <script src="./m01.01_events.js"></script>
</body>
</html>
