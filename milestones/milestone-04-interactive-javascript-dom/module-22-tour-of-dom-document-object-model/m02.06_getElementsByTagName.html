<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour of DOM</title>
    <link rel="stylesheet" href="./m01.02_dom_intro.css">
    <style>
        h1 {
            color: green;
        }
    </style>
</head>
<body>
    <header>
        <h1>This is my header and no banner</h1>
    </header>
    <main>
        <h1>Welcome to my DOM</h1>
        <ul>
            <li>Shafayet</li>
            <li>Bonobash</li>
            <li>Jalali Set</li>
        </ul>
    </main>
    <script>
        console.log('Document Object Model');
        const student = {
            name: 'Alice',
            id: 123,
            study: function(subject) {
                console.log('Studying subject: ', subject);
            }
        }
        // document.getElementsByTagName
        const liCollection = document.getElementsByTagName('li');
        console.log(liCollection);
        for(const li of liCollection) {
            console.log(li.innerText);
        }
        // all h1 tags
        const allHeadings = document.getElementsByTagName('h1')                    /* */
        for(const heading of allHeadings) {
            console.log(heading);
        }
    </script>
    <script src="./m01.06_dom_intro.js"></script>
</body>
</html>
